{% extends "scoutApp/base.html" %}
{% block title %}Supprimer un scout{% endblock %}
{% block content %}
<h1>Supprimer le scout</h1>
<p>Voulez-vous vraiment supprimer {{ object }} ?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Supprimer</button>
    <a href="{% url 'scoutApp:scout-list' %}">Annuler</a>
</form>
{% endblock %}
